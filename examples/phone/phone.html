<script>

// ---------- props ----------

// ---------- scenes ----------
function sHook(lt, t) {

  if (t > L[2].start - .3) { const k = eob(inv(L[2].start - .3, L[2].start, t)); phoneDev(760, 980, 1.35 * k, mode, { pct, rot: -.06 }); }
}
function sWarm(lt, t) {
  ctx.fillStyle = '#fbbf77'; ctx.fillRect(-200, -200, W + 400, H + 400);
  box(620, 300, 360, 380, '#bfdbfe', 10, 8); line(800, 300, 800, 680, 8); line(620, 490, 980, 490, 8); snow(t, 25, .6);
  ctx.fillStyle = '#d97706'; ctx.fillRect(-200, 1380, W + 400, 800); line(-200, 1380, W + 200, 1380, 8);

  if (t > T.ghost - .2) { const k = eo(inv(T.ghost - .2, T.ghost + 1.2, t)); battChar(760, 900 - k * 380, .95, { ghost: true, halo: true, col: '#f59e0b' }); }

function sScience(lt, t) {

}
function sEnd(lt, t) {

    if (k >= .9) { // phone peeking from inside pocket

const CAP = [
  ["your phone says", "40%", "you step outside...", "and it dies"],
  ["winter in germany", "-5 degrees"],
  ["you're checking", "when your train comes"],
  ["30%", "20%", "black screen"],
  ["you go back inside", "warm it up...", "and suddenly", "it says 30%", "again"],

  ["in the cold,", "they slow down", "like you", "trying to get", "out of bed", "on a january morning"],

const HOT = new Set(["40%", "and it dies", "-5 degrees", "black screen", "it says 30%", "from the dead?", "chemical reactions", "they slow down", "is still there", "to protect itself", "0 and 35 degrees", "inside pocket", "as much as you do"]);

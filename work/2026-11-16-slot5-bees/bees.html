<script src="../../engine/engine.js"></script><script>
const mid = (a, b) => (L[a].end + L[b].start) / 2;
const T = { gone: wt(0, 'is gone'), sting: at(1, 0), nice: wt(1, 'nice'), snack: wt(1, 'but one snack'), market: at(2, 0), off: wt(2, "something"), three: at(3, 0), melon: at(4, 0), coffee: wt(4, 'coffee'), fewer: wt(4, 'way fewer'), surp: at(5, 0), starve: wt(5, "you wouldn't"), wheat: at(6, 0), wind: wt(6, 'wind'), sci: at(7, 0), pct: wt(7, 'five'), boring: at(8, 0), snack2: wt(8, 'and that'), choc: at(9, 0), cocoa: wt(9, 'cocoa'), tiny: wt(9, 'tiny flies'), noflies: wt(9, 'no flies') };
function popIn(t, t0, x, y, fn, d = .25) { if (t < t0) return; const k = eob(inv(t0, t0 + d, t)); ctx.save(); ctx.translate(x, y); ctx.scale(k, k); fn(); ctx.restore(); }

function cocoaPod(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = '#d97706'; ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(0, 0, 80, 140, 0, 0, 7); ctx.fill(); ctx.stroke(); for (const dx of [-40, 0, 40]) { ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(dx * .8, 0, 6, 120 - Math.abs(dx), 0, 0, 7); ctx.stroke(); } ctx.restore(); }
// ---------- scene 1: garden, no bees ----------
function sGarden(lt, t) {
  bgFill('#bae6fd'); floor('#86efac', 1300);

// ---------- scene 2: supermarket ----------
function shelves() { bgFill('#f1f5f9'); for (let r = 0; r < 3; r++) box(-40, 520 + r * 260, W + 80, 24, '#94a3b8', 4, 6); floorTiles(1340, '#e2e8f0', '#cbd5e1'); }

  // melons/kiwis vanish, coffee/avocado shrink

// ---------- scene 3: fields ----------
function sField(lt, t) {

  for (let i = 0; i < 9; i++) { const sway = Math.sin(t * 3 + i) * .12; ctx.save(); ctx.translate(60 + i * 120, 1330); ctx.rotate(sway); grain(0, 0, 1.1, ['wheat', 'rice', 'corn'][i % 3]); ctx.restore(); }

// ---------- scene 4: chocolate ----------
function sChoc(lt, t) {

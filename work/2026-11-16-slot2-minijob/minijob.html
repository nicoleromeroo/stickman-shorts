<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lucky;src:url(../../engine/node_modules/@fontsource/luckiest-guy/files/luckiest-guy-latin-400-normal.woff2)}
@font-face{font-family:Nun;font-weight:900;src:url(../../engine/node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/engine.js"></script><script>
const mid = (a, b) => (L[a].end + L[b].start) / 2;
const T = { pay: wt(0, 'payday'), how: wt(0, 'how much'), mini: at(1, 0), max: wt(1, 'and the max'), why: at(2, 0), ten: wt(2, "it's ten"), wage: at(3, 0), num: wt(3, 'thirteen'), def: at(4, 0), pct: wt(4, 'three point'), abt: wt(4, 'about'), opt: at(5, 0), give: wt(5, 'but then'), twist: at(6, 0), u18: at(7, 0), app: wt(7, "haven't"), mw: wt(7, 'minimum wage'), boss: at(8, 0), less: wt(8, 'less than'), check: at(9, 0) };
function popIn(t, t0, x, y, fn, d = .25) { if (t < t0) return; const k = eob(inv(t0, t0 + d, t)); ctx.save(); ctx.translate(x, y); ctx.scale(k, k); fn(); ctx.restore(); }
function foot(s) { txt(s, 540, 1860, 34, '#f1f5f9', { lw: 6 }); }
function coin(x, y, r) { circ(x, y, r, '#facc15', INK, 6); circ(x, y, r * .7, null, '#ca8a04', 5); txt('€', x, y + 4, r * 1.1, '#a16207', { stroke: false }); }
function doc(x, y, s, title, col = '#fff') { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); box(-150, -200, 300, 400, col, 14, 8); txt(title, 0, -140, 46, INK, { stroke: false }); for (let i = 0; i < 5; i++) line(-110, -70 + i * 50, 110 - (i % 2) * 40, -70 + i * 50, 8, '#94a3b8'); ctx.restore(); }
// ---------- payday ----------
function sPay(lt, t) {
  bgFill('#e0e7ff'); floor('#a5b4fc', 1420);
  const x = 380, s = 1.3;
  hero({ x, y: 1500, s, pose: { lt: .05, ls: 0, rt: -.05, rs: 0, la: .3, le: .2, ra: -1.0, re: -1.1 }, eyes: t > T.pay ? 'huge' : 'norm', mouth: t > T.pay ? 'grin' : 'smile', look: 1, hold: holdPhone('on', { draw: (sx, sy, sw, sh) => { if (t > T.pay) { ctx.fillStyle = '#fff'; rr(sx + 10, sy + 30, sw - 20, 70, 10); ctx.fill(); txt('€€€', sx + sw / 2, sy + 66, 40, '#16a34a', { stroke: false }); } } }) });
  txt('FIRST JOB!', 540, 260, 130, '#fde047', { lw: 22 });
  popIn(t, .2, 540, 410, () => { box(-230, -50, 460, 100, '#1e3a8a', 22, 7); txt('10 H / WEEK', 0, 6, 64, '#fff', { stroke: false }); });
  if (t > T.pay) popIn(t, T.pay, 780, 760, () => { box(-230, -110, 460, 220, '#fff', 30, 9); txt('PAYDAY', 0, -40, 58, '#16a34a', { stroke: false }); txt('+ € ???', 0, 40, 84, INK, { stroke: false }); });
  for (let i = 0; i < 6; i++) if (t > T.pay) { const yy = ((t - T.pay) * 500 + i * 230) % 1100 + 300; coin(700 + (rnd(i) - .5) * 600, yy, 40); }
}
// ---------- the 603 limit ----------
function sLimit(lt, t) {
  bgFill('#dcfce7');
  if (t < T.why) {
    txt('MINIJOB', 540, 280, 140, '#16a34a', { lw: 22 });
    popIn(t, T.max, 540, 640, () => { box(-400, -170, 800, 340, '#fff', 36, 10); txt('MAX', 0, -125, 60, '#64748b', { stroke: false }); txt('€603', 0, 15, 170, '#15803d', { stroke: false }); txt('PER MONTH', 0, 125, 56, INK, { stroke: false }); });
    for (let i = 0; i < 5; i++) coin(200 + i * 170, 1250 - Math.abs(Math.sin(t * 4 + i)) * 40, 60);
    foot('Minijob limit 2026 (Deutsche Rentenversicherung)');
  } else {
    txt('WHY 603?', 540, 260, 140, '#fde047', { lw: 22 });
    popIn(t, T.ten, 540, 520, () => { box(-430, -80, 860, 160, '#fff', 30, 8); txt('10 H x 52 WEEKS / 12', 0, 6, 70, INK, { stroke: false }); });
    if (t > T.wage) { popIn(t, T.num, 540, 740, () => { box(-330, -90, 660, 180, '#16a34a', 30, 9); txt('x €13.90 / H', 0, 8, 90, '#fff', { lw: 12 }); }); }
    if (t > T.num + .6) popIn(t, T.num + .6, 540, 960, () => txt('= €602.33', 0, 0, 120, '#15803d', { lw: 18, strokeCol: '#fff' }));
    if (t > T.num + 1.2) popIn(t, T.num + 1.2, 540, 1110, () => txt('ROUNDED UP: €603', 0, 0, 64, INK, { stroke: false }));
    stick({ x: 180, y: 1560, s: .9, shirt: '#3b82f6', pants: '#334155', hood: true, pose: STAND, eyes: 'huge', mouth: 'o', look: 1 });
    foot('Minimum wage 2026: €13.90 (Deutsche Rentenversicherung)');
  }
}
// ---------- pension ----------
function sPension(lt, t) {
  bgFill('#fef3c7'); floor('#fcd34d', 1420);
  const x = 280, s = 1.2;
  if (t < T.opt) {
    // coin stack, small slice flies to piggy bank
    for (let i = 0; i < 6; i++) coin(620 + (i % 3) * 120, 1350 - Math.floor(i / 3) * 90, 55);
    const fly = eo(inv(T.abt, T.abt + .8, t));
    ctx.save(); ctx.fillStyle = '#f9a8d4'; ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(840, 900, 150, 110, 0, 0, 7); ctx.fill(); ctx.stroke(); circ(990, 890, 40, '#f9a8d4', INK, 7); box(820, 790, 60, 14, INK, 4, 0); ctx.restore(); txt('PENSION', 840, 1060, 54, '#be185d', { lw: 10, strokeCol: '#fff' });
    if (t > T.abt) coin(lerp(680, 850, fly), lerp(1260, 780, fly) - Math.sin(fly * Math.PI) * 120, 48);
    popIn(t, T.pct, 540, 300, () => { box(-280, -100, 560, 200, '#be185d', 30, 9); txt('-3.6%', 0, 8, 130, '#fff', { lw: 14 }); });
    if (t > T.abt) popIn(t, T.abt, 540, 500, () => txt('= ABOUT €22', 0, 0, 90, INK, { stroke: false }));
    hero({ x, y: 1500, s, pose: STAND, eyes: 'huge', mouth: 'o', look: 1 });
    foot('Employee share 3.6% (Deutsche Rentenversicherung)');
  } else {
    doc(700, 900, 1.3, 'OPT OUT?');
    popIn(t, T.opt + .4, 820, 1080, () => { ctx.save(); ctx.rotate(-.5); box(-30, -170, 60, 280, '#f59e0b', 8, 7); ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(-30, 110); ctx.lineTo(30, 110); ctx.lineTo(0, 170); ctx.fill(); ctx.restore(); });
    txt('IN WRITING', 540, 280, 110, '#fff', { lw: 18 });
    if (t > T.give) popIn(t, T.give, 540, 440, () => { box(-400, -60, 800, 120, '#ef4444', 26, 8); txt('LESS PENSION COVER', 0, 6, 66, '#fff', { lw: 10 }); });
    hero({ x, y: 1500, s, pose: { lt: .05, ls: 0, rt: -.05, rs: 0, la: .3, le: .2, ra: -1.2, re: -.4 }, eyes: 'norm', mouth: 'flat', look: 1 });
    foot('Opt-out rules (Minijob-Zentrale)');
  }
}
// ---------- twist ----------
function sTwist(lt, t) {
  bgFill('#1e1b4b');
  if (t < T.u18) { const k = eob(inv(T.twist, T.twist + .3, t)); txt('NOW THE', 540, 760, 130 * k, '#fff', { lw: 20 }); txt('TWIST', 540, 920, 200 * k, '#f43f5e', { lw: 28 }); return; }
  const x = 330, s = 1.25;
  hero({ x, y: 1500, s, pose: STAND, eyes: 'huge', mouth: t > T.boss ? 'o' : 'flat', look: 1 });
  popIn(t, T.u18, 540, 300, () => { box(-260, -100, 520, 200, '#fde047', 30, 9); txt('UNDER 18', 0, 8, 110, INK, { stroke: false }); });
  if (t > T.app) popIn(t, T.app, 540, 470, () => txt('+ NO FINISHED TRAINING', 0, 0, 60, '#fff', { lw: 12 }));
  if (t > T.mw && t < T.boss) popIn(t, T.mw, 760, 860, () => { box(-230, -120, 460, 240, '#fff', 30, 9); txt('MIN. WAGE', 0, -40, 66, INK, { stroke: false }); txt('€13.90', 0, 50, 86, '#16a34a', { stroke: false }); line(-200, 100, 200, -100, 22, '#dc2626'); line(-200, -100, 200, 100, 22, '#dc2626'); });
  if (t > T.boss) {
    stick({ x: 800, y: 1500, s: 1.2, shirt: '#475569', pants: '#1f2937', hair: '#111827', flip: true, pose: { lt: .05, ls: 0, rt: -.05, rs: 0, la: .3, le: .2, ra: -1.0, re: -.8 }, eyes: 'norm', mouth: 'smirk', look: -1 });
    popIn(t, T.less, 540, 780, () => { box(-330, -90, 660, 180, '#dc2626', 30, 9); txt('LESS THAN €13.90', 0, 8, 76, '#fff', { lw: 10 }); });
  }
  foot('§ 22 MiLoG (gesetze-im-internet.de), TK');
}
// ---------- check contract ----------
function sCheck(lt, t) {
  bgFill('#e0f2fe');
  doc(540, 900, 1.6, 'CONTRACT');
  const mx = 540 + Math.sin(t * 2.5) * 120, my = 900;
  ctx.save(); ctx.lineWidth = 16; ctx.strokeStyle = INK; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(mx, my, 130, 0, 7); ctx.fill(); ctx.stroke(); line(mx + 92, my + 92, mx + 210, my + 210, 28); ctx.restore();
  txt('€ / HOUR?', mx, my, 56, '#dc2626', { stroke: false });
  txt('CHECK BEFORE', 540, 260, 110, '#1e3a8a', { lw: 18, strokeCol: '#fff' }); txt('YOU SIGN', 540, 390, 120, '#f59e0b', { lw: 20 });
  foot('Not financial or legal advice');
}
const SCENES = [{ t0: 0, fn: sPay, push: .04 }, { t0: mid(0, 1), fn: sLimit, push: .03, flash: 1 }, { t0: mid(3, 4), fn: sPension, push: .03, flash: 1 }, { t0: mid(5, 6), fn: sTwist, push: .05, flash: 1 }, { t0: mid(8, 9), fn: sCheck, push: .05, xfade: .25 }];
const CAP = [["you just got", "your first job.", "ten hours a week.", "payday hits.", "how much is it?"], ["in germany,", "that's often a minijob.", "and the max is", "603 euros a month."], ["why such", "a weird number?", "it's ten hours a week", "at minimum wage."], ["minimum wage", "this year:", "13.90 euros an hour."], ["but by default,", "3.6 percent", "goes into your pension.", "about 22 euros."], ["you can opt out", "in writing.", "but then you give up", "part of your", "pension benefits."], ["now the twist."], ["if you're under 18", "and haven't finished", "an apprenticeship,", "minimum wage", "doesn't apply to you."], ["so your boss", "can legally pay you", "less than 13.90."], ["check the hourly pay", "before you sign."]];
const HOT = new Set(["your first job.", "how much is it?", "603 euros a month.", "at minimum wage.", "13.90 euros an hour.", "3.6 percent", "about 22 euros.", "pension benefits.", "now the twist.", "doesn't apply to you.", "less than 13.90.", "before you sign."]);
window.render = (t) => runScenes(t, SCENES, { after: (t) => captions(t, CAP, HOT, 1680) });
</script></body></html>
